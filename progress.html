        .dark .border-outline-variant\/50 { border-color: rgba(184, 174, 166, 0.2) !important; }

        .signal-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .signal-bars i { display: block; width: 4px; border-radius: 2px; background: #d8d0c8; }
        .dark .signal-bars i { background: #4a4038; }
        .signal-bars i.on { background: #c2652a; }
        .signal-bars i:nth-child(1) { height: 4px; } .signal-bars i:nth-child(2) { height: 6px; }
        .signal-bars i:nth-child(3) { height: 8px; } .signal-bars i:nth-child(4) { height: 10px; }
        .signal-bars i:nth-child(5) { height: 12px; } .signal-bars i:nth-child(6) { height: 14px; }
        .signal-bars i:nth-child(7) { height: 16px; } .signal-bars i:nth-child(8) { height: 18px; }
        .signal-bars i:nth-child(9) { height: 20px; } .signal-bars i:nth-child(10) { height: 22px; }
        .skeleton { background: linear-gradient(90deg, #ece6dc 25%, #f6f0e8 37%, #ece6dc 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: .5rem; }

<body class="font-body bg-background text-on-background">

<!-- Mobile Top AppBar -->

    </button>
    <button type="button" onclick="openSettingsModal()" class="p-2 rounded-xl text-on-surface-variant hover:text-primary transition-colors" title="Paramètres">
      <span class="material-symbols-outlined text-2xl">settings</span>
    </button>
  </div>
</header>

<!-- Desktop SideNav -->
<nav class="hidden md:flex flex-col h-screen w-72 bg-surface border-r border-outline-variant/60 shadow-md fixed inset-y-0 left-0 z-50">
<div class="p-6 border-b border-outline-variant/60 flex items-center justify-between">
  <a href="/profile.html" class="flex items-center gap-4 mb-1">
    <img alt="Avatar" class="w-11 h-11 rounded-full border-2 border-primary-container bg-surface-container object-cover" id="dnav-avatar" src=""/>
    <div>

  </button>
</div>

<div class="flex-1 py-4 overflow-y-auto">
  <a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/dashboard.html" id="nav-d-dashboard">
    <span class="material-symbols-outlined">dashboard</span>
    <span class="font-body" data-i18n="nav_dashboard">Tableau de bord</span>
  </a>
  <a class="flex items-center gap-3 bg-primary-container text-on-primary-container font-bold rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/dashboard.html#lecons" id="nav-d-lessons">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu_book</span>
    <span class="font-body" data-i18n="nav_lessons">Leçons</span>
  </a>
  <a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/leaderboard.html" id="nav-d-rank">
    <span class="material-symbols-outlined">leaderboard</span>
    <span class="font-body" data-i18n="nav_leaderboard">Classement</span>
  </a>
  <a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/profile.html" id="nav-d-profile">
    <span class="material-symbols-outlined">person</span>
    <span class="font-body" data-i18n="nav_profile">Profil</span>
  </a>
</div>

<div class="p-4 border-t border-outline-variant/60 flex items-center justify-between">
  <button class="flex items-center gap-2 text-on-surface-variant hover:text-error transition-colors px-3 py-2 text-sm font-body" id="logout-btn-desktop">
    <span class="material-symbols-outlined text-base">logout</span>

<!-- Main Container -->
<main class="flex-1 md:ml-72 flex flex-col min-h-screen pb-24 md:pb-0">
<div class="p-6 md:p-12 max-w-3xl mx-auto w-full flex-1">

  <h1 class="font-headline text-4xl font-bold mb-2 text-on-background">Détail de votre Progression</h1>
  <p class="text-on-surface-variant font-body mb-8">Historique et états de vos 10 modules de formation.</p>

  <div class="bg-surface-container-lowest border border-outline-variant/60 rounded-3xl p-6 flex items-center justify-between mb-8 soft-shadow" id="prog-hero">
    <div>
      <p class="text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant">Avancement Global</p>
      <p class="font-headline text-3xl font-bold mt-1 text-primary" id="prog-title">0 / 10 Terminé</p>
    </div>
    <div class="signal-bars" id="prog-bars"></div>
  </div>

  <div class="grid gap-4" id="prog-list">
    <div class="skeleton h-24"></div><div class="skeleton h-24"></div>
    <div class="skeleton h-24"></div><div class="skeleton h-24"></div>
  </div>

</div>
</main>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    mountAuthedChrome(user);

    const data = await api("/api/progress");
    document.getElementById("prog-title").textContent = `${data.leconsTerminees} / ${data.leconsTotal} Terminé`;
    document.getElementById("prog-bars").innerHTML = signalBarsHtml(data.leconsTerminees, data.leconsTotal);

    document.getElementById("prog-list").innerHTML = data.details.map((d) => `
      <a href="/lesson.html?id=${d.id}" class="block bg-surface-container-lowest border ${d.terminee ? "border-l-4 border-l-primary border-outline-variant/60" : "border-outline-variant/60"} rounded-2xl p-5 soft-shadow hover:border-primary/60 transition-colors">
        <div class="flex items-center gap-4">
          <div class="w-11 h-11 rounded-xl ${d.terminee ? "bg-primary text-on-primary" : "bg-surface-container-high text-on-surface-variant"} flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-xl">${d.terminee ? "check" : "menu_book"}</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-headline font-bold text-lg text-on-background">${escapeHtml(d.titre)}</p>
          </div>
        </div>
        <div class="flex justify-between mt-4 pt-4 border-t border-outline-variant/40 text-xs font-body">
          <div>
            <p class="text-[10px] uppercase tracking-wider font-label text-on-surface-variant">Score Quiz</p>
            <p class="font-bold text-sm ${d.terminee ? "text-primary" : "text-on-surface-variant"}">${d.score !== null ? `${d.score} / ${d.total}` : "—"}</p>
          </div>
          <div class="text-right">
            <p class="text-[10px] uppercase tracking-wider font-label text-on-surface-variant">Statut</p>
            <p class="font-bold text-sm text-on-background">${d.date_completion ? new Date(d.date_completion + "Z").toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "À réaliser"}</p>
          </div>
        </div>
      </a>
    `).join("");
  })();
</script>

</body>
</html>
