<style>
        body { background-color: #faf5ee; color: #3a302a; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
        }
        .browser-mockup { box-shadow: 0 10px 40px rgba(58,48,42,0.10); border: 1px solid #d8d0c8; }
        .soft-shadow { box-shadow: 0 2px 16px rgba(58,48,42,0.06); }
        /* Barres de signal = progression (4 leçons) */
        .signal-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .signal-bars i { display: block; width: 5px; border-radius: 2px; background: #d8d0c8; }
        .signal-bars i.on { background: #c2652a; }
        .signal-bars i:nth-child(1) { height: 7px; } .signal-bars i:nth-child(2) { height: 11px; }
        .signal-bars i:nth-child(3) { height: 15px; } .signal-bars i:nth-child(4) { height: 20px; }
        /* Avatars */
        .avatar-option { border-radius: 9999px; border: 2px solid #d8d0c8; padding: 3px; cursor: pointer; background: #fff; transition: border-color .15s, transform .15s; }
        .avatar-option:hover { transform: translateY(-2px); }
        .avatar-option.selected { border-color: #c2652a; box-shadow: 0 0 0 3px #fbe8d8; }
        .avatar-option img { width: 100%; height: 100%; border-radius: 9999px; display: block; }
        /* Quiz options */
        .quiz-option { border: 1px solid #d8d0c8; border-radius: .75rem; padding: 14px 18px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; font-family: 'Manrope', sans-serif; }
        .quiz-option:hover { border-color: #c2652a; }
        .quiz-option.selected { border-color: #c2652a; background: #fbe8d8; }
        /* Callout astuce */
        .callout { background: #fbe8d8; border-left: 3px solid #c2652a; border-radius: .5rem; padding: 16px 20px; display: flex; gap: 12px; }
        /* Prose leçon */
        .lesson-prose p { margin-bottom: 16px; line-height: 1.75; color: #4a4038; }
        .lesson-prose h4 { font-family: 'EB Garamond', serif; font-weight: 700; font-size: 1.4rem; margin-top: 28px; margin-bottom: 10px; color: #3a302a; }
        .lesson-prose ul { margin: 0 0 16px 20px; display: grid; gap: 8px; }
        .lesson-prose li { line-height: 1.6; color: #4a4038; }
        .lesson-prose strong { color: #3a302a; }
        .skeleton { background: linear-gradient(90deg, #ece6dc 25%, #f6f0e8 37%, #ece6dc 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: .5rem; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        input:focus { outline: none; border-color: #c2652a !important; box-shadow: 0 0 0 3px #fbe8d8; }
</style>
</head>
<body class="font-body bg-background">


<!-- Mobile Top AppBar -->
<header class="md:hidden flex justify-between items-center w-full px-6 py-4 bg-background border-b border-outline-variant/60 sticky top-0 z-40">

<img alt="Avatar" class="w-10 h-10 rounded-full border-2 border-primary-container bg-surface-container" id="mnav-avatar" src=""/>
<span class="font-headline text-2xl font-bold text-primary">NetInit</span>
</a>
<button class="text-on-surface-variant hover:text-primary transition-colors" id="logout-btn-mobile" title="Déconnexion">
<span class="material-symbols-outlined">logout</span>
</button>
</header>
<!-- Desktop SideNav -->
<nav class="hidden md:flex flex-col h-screen w-72 bg-surface border-r border-outline-variant/60 shadow-md fixed inset-y-0 left-0 z-50">
<div class="p-6 border-b border-outline-variant/60">

<img alt="Avatar" class="w-12 h-12 rounded-full border-2 border-primary-container bg-surface-container" id="dnav-avatar" src=""/>
<div>
<h2 class="font-headline text-xl text-primary font-bold" id="dnav-name">—</h2>
<p class="text-sm text-on-surface-variant font-body">NetInit Platform</p>
</div>
</a>
</div>
<div class="flex-1 py-4 overflow-y-auto">
<a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-lg m-2 px-4 py-3 transition-all duration-200" href="/dashboard.html" id="nav-d-dashboard"><span class="material-symbols-outlined" style="">dashboard</span><span class="font-body">Tableau de bord</span></a>
<a class="flex items-center gap-3 bg-primary-container text-on-primary-container font-bold rounded-lg m-2 px-4 py-3 transition-all duration-200" href="/dashboard.html#lecons" id="nav-d-lessons"><span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu_book</span><span class="font-body">Leçons</span></a>
<a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-lg m-2 px-4 py-3 transition-all duration-200" href="/leaderboard.html" id="nav-d-rank"><span class="material-symbols-outlined" style="">leaderboard</span><span class="font-body">Classement</span></a>
<a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-lg m-2 px-4 py-3 transition-all duration-200" href="/profile.html" id="nav-d-profile"><span class="material-symbols-outlined" style="">person</span><span class="font-body">Profil</span></a>
</div>
<div class="p-4 border-t border-outline-variant/60">
<button class="flex items-center gap-3 text-on-surface-variant hover:text-error transition-colors w-full px-4 py-2" id="logout-btn-desktop">
<span class="material-symbols-outlined">logout</span>
<span class="font-body text-sm">Déconnexion</span>
</button>

</nav>
<!-- Mobile Bottom Navigation Bar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 bg-surface-container-low shadow-[0_-2px_16px_rgba(58,48,42,0.08)] z-50 rounded-t-xl pb-6">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1 transition-colors" href="/dashboard.html"><span class="material-symbols-outlined" style="">dashboard</span><span class="font-label text-xs uppercase tracking-wider mt-1">Tableau</span></a>

<main class="flex-1 md:ml-72 flex flex-col min-h-screen pb-20 md:pb-0">
<div class="p-6 md:p-12 max-w-2xl mx-auto w-full flex-1">

  <h1 class="font-headline text-4xl font-bold mb-3">Mon Parcours</h1>
  <p class="text-on-surface-variant font-body mb-8">Le détail de vos leçons terminées et de vos scores.</p>

  <div class="bg-surface-container-low border border-outline-variant/40 rounded-xl p-5 flex items-center justify-between mb-8" id="prog-hero">
    <div>
      <p class="text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant">Progression globale</p>
      <p class="font-headline text-2xl font-bold mt-1" id="prog-title">0 / 4 Terminé</p>
    </div>
    <div class="signal-bars" id="prog-bars"></div>
  </div>

  <div class="grid gap-4" id="prog-list">
    <div class="skeleton h-24"></div><div class="skeleton h-24"></div>
    <div class="skeleton h-24"></div><div class="skeleton h-24"></div>
  </div>

</div>
</main>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    mountAuthedChrome(user);

    const data = await api("/api/progress");
    document.getElementById("prog-title").textContent = `${data.leconsTerminees} / ${data.leconsTotal} Terminé`;
    document.getElementById("prog-bars").innerHTML = signalBarsHtml(data.leconsTerminees, data.leconsTotal);

    document.getElementById("prog-list").innerHTML = data.details.map((d) => `
      <a href="/lesson.html?id=${d.id}" class="block bg-surface-container-lowest border ${d.terminee ? "border-l-4 border-l-primary border-outline-variant/50" : "border-outline-variant/50"} rounded-xl p-5 soft-shadow">
        <div class="flex items-center gap-4">
          <div class="w-10 h-10 rounded-full ${d.terminee ? "bg-primary text-on-primary" : "bg-surface-container-high text-on-surface-variant"} flex items-center justify-center shrink-0">
            <span class="material-symbols-outlined text-lg">${d.terminee ? "check" : "menu_book"}</span>
          </div>
          <div class="flex-1 min-w-0">
            <p class="font-headline font-bold">${escapeHtml(d.titre)}</p>
          </div>
        </div>
        <div class="flex justify-between mt-4 pt-4 border-t border-outline-variant/40 text-sm font-body">
          <div>
            <p class="text-xs uppercase tracking-wider font-label text-on-surface-variant">Score</p>
            <p class="font-bold ${d.terminee ? "text-primary" : "text-on-surface-variant"}">${d.score !== null ? `${d.score}/${d.total}` : "—"}</p>
          </div>
          <div class="text-right">
            <p class="text-xs uppercase tracking-wider font-label text-on-surface-variant">Statut</p>
            <p class="font-bold">${d.date_completion ? new Date(d.date_completion + "Z").toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "À venir"}</p>
          </div>
        </div>
      </a>
    `).join("");
  })();
</script>

</body></html>
