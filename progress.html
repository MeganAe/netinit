<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ma progression — NetInit</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="nav"><div id="nav-root"></div></header>

<main>
  <section class="section" style="padding-top:40px;">
    <div class="container" style="max-width:760px;">

      <div class="section-head">
        <h2>Ma progression</h2>
        <p>Un récapitulatif de vos leçons terminées et des scores obtenus à chaque quiz.</p>
      </div>

      <div class="dash-hero" style="margin-bottom:30px;">
        <div>
          <h1 id="prog-title">—</h1>
          <p id="prog-sub">Chargement...</p>
        </div>
        <div class="signal-progress" id="prog-bars"></div>
      </div>

      <table class="progress-table">
        <thead>
          <tr><th>Leçon</th><th>Statut</th><th>Score</th><th>Terminée le</th></tr>
        </thead>
        <tbody id="prog-body">
          <tr><td colspan="4" class="center-note">Chargement...</td></tr>
        </tbody>
      </table>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>NetInit — Projet tutoré, Université Catholique de Bukavu, 2025 — 2026.</p>
  </div>
</footer>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    await mountNav("/progress.html");

    const data = await api("/api/progress");

    document.getElementById("prog-title").textContent = `${data.leconsTerminees}/${data.leconsTotal} leçons terminées`;
    document.getElementById("prog-sub").textContent =
      data.leconsTerminees === data.leconsTotal
        ? "Parcours complet, félicitations !"
        : "Continuez, chaque leçon vous rapproche de la maîtrise des bases d'Internet.";
    document.getElementById("prog-bars").innerHTML = signalBarsMarkup(data.leconsTerminees, data.leconsTotal);

    document.getElementById("prog-body").innerHTML = data.details.map((d) => `
      <tr>
        <td>${d.titre}</td>
        <td><span class="status-pill ${d.terminee ? "done" : "todo"}">${d.terminee ? "Terminée" : "À faire"}</span></td>
        <td>${d.score !== null ? `${d.score}/${d.total}` : "—"}</td>
        <td>${d.date_completion ? new Date(d.date_completion + "Z").toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric" }) : "—"}</td>
      </tr>
    `).join("");
  })();
</script>
</body>
</html>
