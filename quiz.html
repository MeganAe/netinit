<style>

        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;

        .browser-mockup { box-shadow: 0 10px 40px rgba(58,48,42,0.10); border: 1px solid #d8d0c8; }
        .soft-shadow { box-shadow: 0 2px 16px rgba(58,48,42,0.06); }
        /* Barres de signal = progression (4 leçons) */
        .signal-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .signal-bars i { display: block; width: 5px; border-radius: 2px; background: #d8d0c8; }
        .signal-bars i.on { background: #c2652a; }
        .signal-bars i:nth-child(1) { height: 7px; } .signal-bars i:nth-child(2) { height: 11px; }
        .signal-bars i:nth-child(3) { height: 15px; } .signal-bars i:nth-child(4) { height: 20px; }
        /* Avatars */
        .avatar-option { border-radius: 9999px; border: 2px solid #d8d0c8; padding: 3px; cursor: pointer; background: #fff; transition: border-color .15s, transform .15s; }
        .avatar-option:hover { transform: translateY(-2px); }
        .avatar-option.selected { border-color: #c2652a; box-shadow: 0 0 0 3px #fbe8d8; }
        .avatar-option img { width: 100%; height: 100%; border-radius: 9999px; display: block; }
        /* Quiz options */
        .quiz-option { border: 1px solid #d8d0c8; border-radius: .75rem; padding: 14px 18px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; font-family: 'Manrope', sans-serif; }
        .quiz-option:hover { border-color: #c2652a; }
        .quiz-option.selected { border-color: #c2652a; background: #fbe8d8; }
        /* Callout astuce */
        .callout { background: #fbe8d8; border-left: 3px solid #c2652a; border-radius: .5rem; padding: 16px 20px; display: flex; gap: 12px; }
        /* Prose leçon */
        .lesson-prose p { margin-bottom: 16px; line-height: 1.75; color: #4a4038; }
        .lesson-prose h4 { font-family: 'EB Garamond', serif; font-weight: 700; font-size: 1.4rem; margin-top: 28px; margin-bottom: 10px; color: #3a302a; }
        .lesson-prose ul { margin: 0 0 16px 20px; display: grid; gap: 8px; }
        .lesson-prose li { line-height: 1.6; color: #4a4038; }
        .lesson-prose strong { color: #3a302a; }
        .skeleton { background: linear-gradient(90deg, #ece6dc 25%, #f6f0e8 37%, #ece6dc 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: .5rem; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        input:focus { outline: none; border-color: #c2652a !important; box-shadow: 0 0 0 3px #fbe8d8; }
</style>

<main class="flex-1 md:ml-72 flex flex-col min-h-screen pb-20 md:pb-0">
<div class="p-6 md:p-12 max-w-2xl mx-auto w-full flex-1">

  <div class="flex items-center gap-3 mb-8" id="quiz-progress-wrap">
    <span class="text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant" id="quiz-progress-label">Question</span>
    <div class="flex-1 h-1.5 bg-surface-container-high rounded-full overflow-hidden">
      <div class="h-full bg-primary transition-all" id="quiz-progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div id="quiz-card">
    <div class="skeleton h-8 w-1/2 mb-6"></div>
    <div class="skeleton h-14 mb-3"></div><div class="skeleton h-14 mb-3"></div>
    <div class="skeleton h-14 mb-3"></div><div class="skeleton h-14"></div>
  </div>

</div>
</main>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    mountAuthedChrome(user);

    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) { window.location.href = "/dashboard.html"; return; }

    let lesson, questions;
    try {
      [lesson, questions] = await Promise.all([api(`/api/lessons/${id}`), api(`/api/lessons/${id}/quiz`)]);
    } catch (_) {
      document.getElementById("quiz-card").innerHTML = `<p class="text-center text-on-surface-variant font-body py-10">Ce quiz est introuvable.</p>`;
      return;
    }

    const card = document.getElementById("quiz-card");
    const answers = {};
    let currentIndex = 0;

    function updateProgressBar() {
      const answered = Object.keys(answers).length;
      document.getElementById("quiz-progress-label").textContent = `Question ${Math.min(currentIndex + 1, questions.length)}/${questions.length}`;
      document.getElementById("quiz-progress-bar").style.width = `${(answered / questions.length) * 100}%`;
    }

    function renderQuestion(qi) {
      currentIndex = qi;
      const q = questions[qi];
      updateProgressBar();
      card.innerHTML = `
        <h1 class="font-headline text-2xl md:text-3xl font-bold mb-2">Quiz — ${escapeHtml(lesson.titre)}</h1>
        <p class="text-on-surface-variant font-body mb-8">Évaluez vos connaissances sur cette leçon.</p>
        <div class="bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-6 md:p-8 soft-shadow">
          <p class="font-headline text-xl md:text-2xl font-bold mb-6">${escapeHtml(q.question)}</p>
          <div class="grid gap-3" id="options-wrap">
            ${q.options.map((opt) => `
              <label class="quiz-option ${answers[q.id] === opt ? "selected" : ""}">
                <input type="radio" name="q-${q.id}" value="${escapeHtml(opt)}" class="accent-primary" ${answers[q.id] === opt ? "checked" : ""} />
                <span>${escapeHtml(opt)}</span>
              </label>
            `).join("")}
          </div>
        </div>
        <div class="flex items-center justify-between mt-8">
          <button class="text-on-surface-variant hover:text-primary font-body text-sm flex items-center gap-1 ${qi === 0 ? "invisible" : ""}" id="btn-prev">
            <span class="material-symbols-outlined text-base">arrow_back</span> Précédent
          </button>
          <button class="bg-primary text-on-primary font-bold px-6 py-3 rounded-lg hover:bg-primary/90 transition-colors font-body flex items-center gap-2 disabled:opacity-40" id="btn-next" ${!answers[q.id] ? "disabled" : ""}>
            ${qi === questions.length - 1 ? "Valider mes réponses" : "Suivant"}
            <span class="material-symbols-outlined text-lg">arrow_forward</span>
          </button>
        </div>
      `;

      card.querySelectorAll(".quiz-option").forEach((label) => {
        label.addEventListener("click", () => {
          answers[q.id] = label.querySelector("input").value;
          card.querySelectorAll(".quiz-option").forEach((l) => l.classList.remove("selected"));
          label.classList.add("selected");
          document.getElementById("btn-next").disabled = false;
          updateProgressBar();
        });
      });

      const prevBtn = document.getElementById("btn-prev");
      if (prevBtn) prevBtn.addEventListener("click", () => renderQuestion(qi - 1));
      document.getElementById("btn-next").addEventListener("click", () => {
        if (qi === questions.length - 1) submitQuiz();
        else renderQuestion(qi + 1);
      });
    }

    async function submitQuiz() {
      const btn = document.getElementById("btn-next");
      btn.disabled = true;
      btn.textContent = "Envoi...";
      try {
        const result = await api(`/api/lessons/${id}/quiz`, { method: "POST", body: { reponses: answers } });
        renderResult(result);
      } catch (err) {
        alert(err.message);
        btn.disabled = false;
      }
    }

    function renderResult(result) {
      const pass = result.score >= Math.ceil(result.total * 0.6);
      document.getElementById("quiz-progress-wrap").style.display = "none";
      card.innerHTML = `
        <div class="text-center bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-10 soft-shadow">
          <div class="font-headline text-6xl font-bold ${pass ? "text-primary" : "text-error"} mb-3">${result.score}/${result.total}</div>
          <p class="text-on-surface-variant font-body mb-8">${pass ? "Bien joué, cette leçon est validée." : "Vous pouvez relire la leçon et retenter le quiz."}</p>
          <div class="flex justify-center gap-3 flex-wrap">
            <a href="/dashboard.html" class="border border-outline text-on-background font-bold px-6 py-3 rounded-lg font-body">Tableau de bord</a>
            ${pass
              ? `<a href="/leaderboard.html" class="bg-primary text-on-primary font-bold px-6 py-3 rounded-lg font-body">Voir le classement</a>`
              : `<a href="/lesson.html?id=${id}" class="bg-primary text-on-primary font-bold px-6 py-3 rounded-lg font-body">Relire la leçon</a>`}
          </div>
        </div>
      `;
    }

    renderQuestion(0);
  })();
</script>

</body></html>
