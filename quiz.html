<!-- Main Container -->

    <span class="text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant" id="quiz-progress-label">Question</span>
    <div class="flex-1 h-2 bg-surface-container-high rounded-full overflow-hidden">
      <div class="h-full bg-primary transition-all duration-300" id="quiz-progress-bar" style="width:0%"></div>
    </div>
  </div>

  <div id="quiz-card">
    <div class="skeleton h-8 w-1/2 mb-6"></div>
    <div class="skeleton h-14 mb-3"></div><div class="skeleton h-14 mb-3"></div>
    <div class="skeleton h-14 mb-3"></div><div class="skeleton h-14"></div>
  </div>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    mountAuthedChrome(user);

    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) { window.location.href = "/dashboard.html"; return; }

    let lesson, questions;
    try {
      [lesson, questions] = await Promise.all([api(`/api/lessons/${id}`), api(`/api/lessons/${id}/quiz`)]);
    } catch (_) {
      document.getElementById("quiz-card").innerHTML = `<p class="text-center text-on-surface-variant font-body py-10">Ce quiz est introuvable.</p>`;
      return;
    }

    const card = document.getElementById("quiz-card");
    const answers = {};
    let currentIndex = 0;

    function updateProgressBar() {
      const answered = Object.keys(answers).length;
      document.getElementById("quiz-progress-label").textContent = `Question ${Math.min(currentIndex + 1, questions.length)}/${questions.length}`;
      document.getElementById("quiz-progress-bar").style.width = `${(answered / questions.length) * 100}%`;
    }

    function renderQuestion(qi) {
      currentIndex = qi;
      const q = questions[qi];
      updateProgressBar();

      card.innerHTML = `
        <div class="mb-6">
          <span class="text-xs font-bold uppercase tracking-wider font-label text-primary">Quiz de validation</span>
          <h1 class="font-headline text-3xl font-bold mb-1 text-on-background">${escapeHtml(lesson.titre)}</h1>
          <p class="text-xs text-on-surface-variant font-body">Sélectionnez la bonne réponse pour valider ce module.</p>
        </div>

        <div class="bg-surface-container-lowest border border-outline-variant/60 rounded-3xl p-6 md:p-8 soft-shadow">
          <p class="font-headline text-xl md:text-2xl font-bold mb-6 text-on-background">${escapeHtml(q.question)}</p>
          
          <div class="grid gap-3 mb-8" id="options-wrap">
            ${q.options.map((opt) => `
              <label class="quiz-option ${answers[q.id] === opt ? "selected" : ""}">
                <input type="radio" name="q-${q.id}" value="${escapeHtml(opt)}" class="accent-primary" ${answers[q.id] === opt ? "checked" : ""} />
                <span class="text-sm text-on-background font-body">${escapeHtml(opt)}</span>
              </label>
            `).join("")}
          </div>

          <div class="flex items-center justify-between pt-4 border-t border-outline-variant/40">
            <button type="button" id="prev-btn" class="px-5 py-2.5 border border-outline rounded-xl font-bold text-xs font-body text-on-surface-variant hover:text-primary transition-colors disabled:opacity-40" ${qi === 0 ? "disabled" : ""}>
              Précédente
            </button>
            <button type="button" id="next-btn" class="px-7 py-3 bg-primary text-on-primary font-bold text-xs rounded-xl hover:bg-primary/90 transition-all font-body flex items-center gap-1 shadow-md">
              <span>${qi === questions.length - 1 ? "Valider le Quiz" : "Suivante"}</span>
              <span class="material-symbols-outlined text-base">arrow_forward</span>
            </button>
          </div>
        </div>
      `;

      card.querySelectorAll("input[type=radio]").forEach((radio) => {
        radio.addEventListener("change", (e) => {
          answers[q.id] = e.target.value;
          card.querySelectorAll(".quiz-option").forEach((opt) => opt.classList.remove("selected"));
          e.target.closest(".quiz-option").classList.add("selected");
          updateProgressBar();
        });
      });

      document.getElementById("prev-btn").addEventListener("click", () => {
        if (currentIndex > 0) renderQuestion(currentIndex - 1);
      });

      document.getElementById("next-btn").addEventListener("click", async () => {
        if (!answers[q.id]) {
          alert("Veuillez sélectionner une réponse avant de continuer.");
          return;
        }
        if (currentIndex < questions.length - 1) {
          renderQuestion(currentIndex + 1);
        } else {
          submitQuiz();
        }
      });
    }

    async function submitQuiz() {
      card.innerHTML = `<div class="text-center py-12"><span class="material-symbols-outlined text-4xl text-primary animate-spin">sync</span><p class="mt-4 font-bold font-body text-sm">Calcul du score en cours...</p></div>`;
      try {
        const res = await api(`/api/lessons/${id}/quiz`, { method: "POST", body: { reponses: answers } });
        showResult(res.score, res.total);
      } catch (err) {
        card.innerHTML = `<p class="text-center text-error font-body py-10">${escapeHtml(err.message)}</p>`;
      }
    }

    function showResult(score, total) {
      const pct = Math.round((score / total) * 100);
      const isSuccess = score >= 3;
      const nextLessonId = Number(id) < 10 ? Number(id) + 1 : null;

      card.innerHTML = `
        <div class="bg-surface-container-lowest border border-outline-variant/60 rounded-3xl p-8 text-center soft-shadow">
          <div class="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center mb-4 ${isSuccess ? "bg-success-container text-success" : "bg-error-container text-error"}">
            <span class="material-symbols-outlined text-4xl">${isSuccess ? "emoji_events" : "refresh"}</span>
          </div>

          <h2 class="font-headline text-3xl font-bold mb-2 text-on-background">${isSuccess ? "Félicitations !" : "Encore un effort !"}</h2>
          <p class="text-sm text-on-surface-variant font-body mb-6">${isSuccess ? "Vous avez validé ce module avec succès." : "Vous n'avez pas atteint le score minimum pour valider ce module."}</p>

          <div class="bg-surface-container-low border border-outline-variant/40 rounded-2xl p-6 max-w-xs mx-auto mb-8">
            <p class="text-xs uppercase tracking-wider font-label text-on-surface-variant font-bold mb-1">Votre Score</p>
            <p class="font-headline text-4xl font-bold text-primary">${score} / ${total}</p>
            <p class="text-xs text-on-surface-variant font-body mt-1">${pct}% de réussites</p>
          </div>

          <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
            <a href="/quiz.html?id=${id}" class="w-full sm:w-auto border border-outline text-on-surface-variant hover:text-primary font-bold text-xs px-6 py-3 rounded-xl font-body">Recommencer le Quiz</a>
            ${nextLessonId ? `<a href="/lesson.html?id=${nextLessonId}" class="w-full sm:w-auto bg-primary text-on-primary font-bold text-xs px-7 py-3 rounded-xl hover:bg-primary/90 font-body">Leçon Suivante →</a>` : `<a href="/dashboard.html" class="w-full sm:w-auto bg-primary text-on-primary font-bold text-xs px-7 py-3 rounded-xl hover:bg-primary/90 font-body">Retour au Tableau de Bord</a>`}
          </div>
        </div>
      `;
    }

    renderQuestion(0);
  })();
</script>
