<style>
        body { background-color: #faf5ee; color: #3a302a; transition: background-color 0.2s, color 0.2s; }
        .dark body { background-color: #1a1614; color: #ece6dc; }
        .dark .bg-background { background-color: #1a1614 !important; }
        .dark .bg-surface { background-color: #241f1c !important; }
        .dark .bg-surface-container-lowest { background-color: #2b2522 !important; color: #ece6dc !important; }
        .dark .bg-surface-container-low { background-color: #241f1c !important; }
        .dark .bg-surface-container { background-color: #2b2522 !important; }
        .dark .bg-surface-container-high { background-color: #342c28 !important; }
        .dark .text-on-background { color: #f5efe6 !important; }
        .dark .text-on-surface-variant { color: #b8aea6 !important; }
        .dark .border-outline-variant\/60 { border-color: rgba(184, 174, 166, 0.2) !important; }
        .dark .border-outline-variant\/50 { border-color: rgba(184, 174, 166, 0.2) !important; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
        }
        .soft-shadow { box-shadow: 0 2px 16px rgba(58,48,42,0.06); }
        .callout { background: #fbe8d8; border-left: 4px solid #c2652a; border-radius: .75rem; padding: 16px 20px; display: flex; gap: 14px; }
        .dark .callout { background: #34261c; border-left-color: #c2652a; }
        .skeleton { background: linear-gradient(90deg, #ece6dc 25%, #f6f0e8 37%, #ece6dc 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: .5rem; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
</style>

<body class="font-body bg-background text-on-background">

<!-- Mobile Top AppBar -->
<header class="md:hidden flex justify-between items-center w-full px-6 py-4 bg-background/90 backdrop-blur-md border-b border-outline-variant/60 sticky top-0 z-40">

  <div class="flex items-center gap-2">
    <button type="button" onclick="openNotificationsDrawer()" class="relative p-2 rounded-xl text-on-surface-variant hover:text-primary transition-colors" title="Notifications">

      <span id="notif-badge" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-primary border-2 border-background"></span>
    </button>
    <button type="button" onclick="openSettingsModal()" class="p-2 rounded-xl text-on-surface-variant hover:text-primary transition-colors" title="Paramètres">
      <span class="material-symbols-outlined text-2xl">settings</span>
    </button>
  </div>
</header>

<!-- Desktop SideNav -->
<nav class="hidden md:flex flex-col h-screen w-72 bg-surface border-r border-outline-variant/60 shadow-md fixed inset-y-0 left-0 z-50">
<div class="p-6 border-b border-outline-variant/60 flex items-center justify-between">
  <a href="/profile.html" class="flex items-center gap-4 mb-1">
    <img alt="Avatar" class="w-11 h-11 rounded-full border-2 border-primary-container bg-surface-container object-cover" id="dnav-avatar" src=""/>
    <div>
      <h2 class="font-headline text-lg text-primary font-bold" id="dnav-name">—</h2>
      <p class="text-xs text-on-surface-variant font-body" data-i18n="platform_tag">Plateforme NetInit</p>
    </div>
  </a>
  <button type="button" onclick="openSettingsModal()" class="text-on-surface-variant hover:text-primary p-1.5 rounded-xl transition-colors" title="Paramètres">
    <span class="material-symbols-outlined text-xl">settings</span>
  </button>
</div>

<div class="flex-1 py-4 overflow-y-auto">
  <a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/dashboard.html" id="nav-d-dashboard">
    <span class="material-symbols-outlined">dashboard</span>
    <span class="font-body" data-i18n="nav_dashboard">Tableau de bord</span>
  </a>
  <a class="flex items-center gap-3 bg-primary-container text-on-primary-container font-bold rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/dashboard.html#lecons" id="nav-d-lessons">
    <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">menu_book</span>
    <span class="font-body" data-i18n="nav_lessons">Leçons</span>
  </a>
  <a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/leaderboard.html" id="nav-d-rank">
    <span class="material-symbols-outlined">leaderboard</span>
    <span class="font-body" data-i18n="nav_leaderboard">Classement</span>
  </a>
  <a class="flex items-center gap-3 text-on-surface-variant hover:bg-surface-container-high rounded-xl m-2 px-4 py-3 transition-all duration-200" href="/profile.html" id="nav-d-profile">
    <span class="material-symbols-outlined">person</span>
    <span class="font-body" data-i18n="nav_profile">Profil</span>
  </a>
</div>

<div class="p-4 border-t border-outline-variant/60 flex items-center justify-between">
  <button class="flex items-center gap-2 text-on-surface-variant hover:text-error transition-colors px-3 py-2 text-sm font-body" id="logout-btn-desktop">
    <span class="material-symbols-outlined text-base">logout</span>
    <span data-i18n="nav_logout">Déconnexion</span>
  </button>
  <button type="button" onclick="openNotificationsDrawer()" class="relative p-2 rounded-xl text-on-surface-variant hover:text-primary transition-colors" title="Notifications">
    <span class="material-symbols-outlined text-xl">notifications</span>
  </button>
</div>
</nav>

<!-- Mobile Bottom Navigation Bar -->
<nav class="md:hidden fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 bg-surface-container-low shadow-[0_-2px_16px_rgba(58,48,42,0.08)] z-50 rounded-t-2xl pb-6 border-t border-outline-variant/50">
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1.5 transition-colors" href="/dashboard.html"><span class="material-symbols-outlined text-xl">dashboard</span><span class="font-label text-[10px] uppercase tracking-wider mt-0.5" data-i18n="nav_dashboard">Tableau</span></a>
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl px-4 py-1.5 transition-transform" href="/dashboard.html#lecons"><span class="material-symbols-outlined text-xl" style="font-variation-settings: 'FILL' 1;">menu_book</span><span class="font-label text-[10px] uppercase tracking-wider mt-0.5" data-i18n="nav_lessons">Leçons</span></a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1.5 transition-colors" href="/leaderboard.html"><span class="material-symbols-outlined text-xl">leaderboard</span><span class="font-label text-[10px] uppercase tracking-wider mt-0.5" data-i18n="nav_leaderboard">Classement</span></a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-variant rounded-xl px-4 py-1.5 transition-colors" href="/profile.html"><span class="material-symbols-outlined text-xl">person</span><span class="font-label text-[10px] uppercase tracking-wider mt-0.5" data-i18n="nav_profile">Profil</span></a>
</nav>

<!-- Main Container -->
<main class="flex-1 md:ml-72 flex flex-col min-h-screen pb-24 md:pb-0">
<div class="p-6 md:p-12 max-w-4xl mx-auto w-full flex-1">

  <div class="flex items-center gap-2 text-xs font-body text-on-surface-variant mb-6" id="crumb">
    <span class="material-symbols-outlined text-sm">lock</span> netinit.vercel.app / lecon
  </div>

  <article id="lesson-article">
    <div class="skeleton h-10 w-2/3 mb-4"></div>
    <div class="skeleton h-4 w-full mb-2"></div>
    <div class="skeleton h-64 w-full mt-6"></div>
  </article>

</div>
</main>

<script src="/js/common.js"></script>
<script>
  const LESSON_IMG = {
    1: "https://images.unsplash.com/photo-1758270705290-62b6294dd044?w=1200&q=80&auto=format&fit=crop",
    2: "https://images.unsplash.com/photo-1743796055664-3473eedab36e?w=1200&q=80&auto=format&fit=crop",
    3: "https://images.unsplash.com/photo-1603791440384-56cd371ee9a7?w=1200&q=80&auto=format&fit=crop",
    4: "https://images.unsplash.com/photo-1768839720936-87ce3adf2d08?w=1200&q=80&auto=format&fit=crop",
    5: "https://images.unsplash.com/photo-1544197150-b99a580bb7a8?w=1200&q=80&auto=format&fit=crop",
    6: "https://images.unsplash.com/photo-1563986768609-322da13575f3?w=1200&q=80&auto=format&fit=crop",
    7: "https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=1200&q=80&auto=format&fit=crop",
    8: "https://images.unsplash.com/photo-1677442136019-21780efad99a?w=1200&q=80&auto=format&fit=crop",
    9: "https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1200&q=80&auto=format&fit=crop",
    10: "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1200&q=80&auto=format&fit=crop",
  };

  (async () => {
    const user = await requireUser();
    if (!user) return;
    mountAuthedChrome(user);

    const id = new URLSearchParams(window.location.search).get("id");
    if (!id) { window.location.href = "/dashboard.html"; return; }

    let lesson;
    try { lesson = await api(`/api/lessons/${id}`); }
    catch (_) {
      document.getElementById("lesson-article").innerHTML = `<p class="text-center text-on-surface-variant font-body py-10">Cette leçon est introuvable.</p>`;
      return;
    }

    const slug = lesson.titre.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").split(" ").slice(0, 2).join("-");
    document.getElementById("crumb").innerHTML = `
      <span class="material-symbols-outlined text-sm">lock</span> netinit.vercel.app / lecon / ${slug}`;

    const prevId = Number(id) > 1 ? Number(id) - 1 : null;
    const nextId = Number(id) < 10 ? Number(id) + 1 : null;

    document.getElementById("lesson-article").innerHTML = `
      <div class="flex items-center gap-2 mb-3 text-xs font-bold uppercase tracking-wider font-label text-primary">
        <span class="material-symbols-outlined text-base">${lesson.icone || "menu_book"}</span> Module ${lesson.ordre} sur 10
      </div>
      <h1 class="font-headline text-3xl md:text-5xl font-bold mb-4 leading-tight text-on-background">${escapeHtml(lesson.titre)}</h1>
      <p class="text-on-surface-variant font-body text-lg mb-8 leading-relaxed">${escapeHtml(lesson.resume)}</p>
      
      <img src="${LESSON_IMG[lesson.ordre] || LESSON_IMG[1]}" alt="" class="w-full h-64 md:h-96 object-cover rounded-3xl soft-shadow mb-8 border border-outline-variant/60"/>
      
      <div class="lesson-prose font-body bg-surface-container-lowest border border-outline-variant/60 rounded-3xl p-6 md:p-10 soft-shadow mb-8">
        ${renderProse(lesson.contenu)}
      </div>

      ${lesson.astuce ? `
        <div class="callout mb-10 soft-shadow">
          <span class="material-symbols-outlined text-primary text-2xl shrink-0">lightbulb</span>
          <div>
            <p class="font-bold font-headline text-primary mb-1 text-base">Astuce Pratique NetInit</p>
            <p class="text-sm font-body text-on-surface-variant leading-relaxed">${escapeHtml(lesson.astuce)}</p>
          </div>
        </div>` : ""}

      <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-6 border-t border-outline-variant/60">
        <div class="flex items-center gap-3 w-full sm:w-auto">
          ${prevId ? `<a href="/lesson.html?id=${prevId}" class="flex-1 sm:flex-none border border-outline text-on-surface-variant hover:text-primary font-body text-xs font-bold px-4 py-2.5 rounded-xl flex items-center justify-center gap-1 transition-colors"><span class="material-symbols-outlined text-base">arrow_back</span> Leçon Précédente</a>` : ""}
          <a href="/dashboard.html" class="text-on-surface-variant hover:text-primary font-body text-xs font-bold flex items-center gap-1 px-3 py-2"><span class="material-symbols-outlined text-base">grid_view</span> Sommaire</a>
        </div>

        <a href="/quiz.html?id=${lesson.id}" class="w-full sm:w-auto bg-primary text-on-primary font-bold text-sm px-7 py-3 rounded-xl hover:bg-primary/90 transition-all font-body flex items-center justify-center gap-2 shadow-lg shadow-primary/20">
          <span>Passer au Quiz de validation</span>
          <span class="material-symbols-outlined text-lg">quiz</span>
        </a>
      </div>
    `;
  })();
</script>

</body>
</html>
