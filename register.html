<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Créer un compte — NetInit</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="nav"><div id="nav-root"></div></header>

<main class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Étape 1 sur 3</span>
    <h1>Créer votre compte</h1>
    <p class="sub">Quelques secondes suffisent pour commencer la première leçon.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="nom">Nom complet</label>
        <input type="text" id="nom" name="nom" autocomplete="name" required />
      </div>
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="new-password" required minlength="6" />
        <small>Au moins 6 caractères.</small>
      </div>

      <div class="form-error" id="form-error"></div>

      <button type="submit" class="btn btn-accent btn-block" id="submit-btn">Créer mon compte</button>
    </form>

    <p class="auth-switch">Déjà un compte ? <a href="/login.html">Se connecter</a></p>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
  mountNav(null);

  const form = document.getElementById("register-form");
  const errorBox = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Création en cours...";

    const nom = document.getElementById("nom").value.trim();
    const email = document.getElementById("email").value.trim();
    const mot_de_passe = document.getElementById("mot_de_passe").value;

    try {
      await api("/api/register", { method: "POST", body: { nom, email, mot_de_passe } });
      window.location.href = "/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Créer mon compte";
    }
  });
</script>
</body>
</html>
