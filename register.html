<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Inscription — NetInit</title>
<script>
  // Applique le thème avant le premier rendu pour éviter le flash de contenu clair.
  if (localStorage.getItem("netinit-theme") === "dark" ||
      (!localStorage.getItem("netinit-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
    document.documentElement.classList.add("dark");
  }
</script>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&family=Manrope:wght@300..800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#faf5ee",
                        surface: "#faf5ee",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#f6f0e8",
                        "surface-container": "#f2ece4",
                        "surface-container-high": "#ece6dc",
                        "surface-variant": "#ece6dc",
                        "outline": "#9a9088",
                        "outline-variant": "#d8d0c8",
                        "on-background": "#3a302a",
                        "on-surface-variant": "#605850",
                        primary: "#c2652a",
                        "primary-container": "#fbe8d8",
                        "primary-fixed": "#fbe8d8",
                        "on-primary": "#ffffff",
                        "on-primary-container": "#7a3a10",
                        "on-primary-fixed": "#401a08",
                        secondary: "#78706a",
                        "secondary-container": "#eae2da",
                        "on-secondary-container": "#3a302a",
                        tertiary: "#8c3c3c",
                        "tertiary-container": "#fce0e0",
                        "on-tertiary-container": "#5c2020",
                        success: "#2f7d4f",
                        "success-container": "#e1f0e5",
                        error: "#c0392b",
                        "error-container": "#fce4e0",
                        gold: "#b8860b",
                        silver: "#8a8f98",
                        bronze: "#a1622e",
                    },
                    borderRadius: { DEFAULT: "0.5rem", lg: "0.75rem", xl: "1rem", full: "9999px" },
                    fontFamily: {
                        headline: ["EB Garamond", "serif"],
                        display: ["EB Garamond", "serif"],
                        body: ["Manrope", "sans-serif"],
                        label: ["Manrope", "sans-serif"],
                    },
                },
            },
        };
</script>
<style>
        body { background-color: #faf5ee; color: #3a302a; transition: background-color .25s ease, color .25s ease; }
        html.dark body { background-color: #1c1712; color: #f0e9e0; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
        }
        .browser-mockup { box-shadow: 0 10px 40px rgba(58,48,42,0.10); border: 1px solid #d8d0c8; }
        html.dark .browser-mockup { border-color: #4a3f34; box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
        .soft-shadow { box-shadow: 0 2px 16px rgba(58,48,42,0.06); }
        html.dark .soft-shadow { box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
        /* Barres de signal = progression */
        .signal-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .signal-bars i { display: block; width: 5px; border-radius: 2px; background: #d8d0c8; }
        .signal-bars i.on { background: #c2652a; }
        .signal-bars i:nth-child(1) { height: 7px; } .signal-bars i:nth-child(2) { height: 11px; }
        .signal-bars i:nth-child(3) { height: 15px; } .signal-bars i:nth-child(4) { height: 20px; }
        /* Avatars */
        .avatar-option { border-radius: 9999px; border: 2px solid #d8d0c8; padding: 3px; cursor: pointer; background: #fff; transition: border-color .15s, transform .15s; }
        .avatar-option:hover { transform: translateY(-2px) scale(1.04); }
        .avatar-option.selected { border-color: #c2652a; box-shadow: 0 0 0 3px #fbe8d8; }
        .avatar-option img { width: 100%; height: 100%; border-radius: 9999px; display: block; }
        /* Quiz options */
        .quiz-option { border: 1px solid #d8d0c8; border-radius: .75rem; padding: 14px 18px; cursor: pointer; transition: border-color .15s, background .15s, transform .1s; display: flex; align-items: center; gap: 12px; font-family: 'Manrope', sans-serif; }
        .quiz-option:hover { border-color: #c2652a; transform: translateX(2px); }
        .quiz-option.selected { border-color: #c2652a; background: #fbe8d8; }
        html.dark .quiz-option.selected { background: #4a2e18; }
        /* Callout astuce */
        .callout { background: #fbe8d8; border-left: 3px solid #c2652a; border-radius: .5rem; padding: 16px 20px; display: flex; gap: 12px; }
        html.dark .callout { background: #3a2a1a; }
        /* Prose leçon */
        .lesson-prose p { margin-bottom: 16px; line-height: 1.75; color: #4a4038; }
        html.dark .lesson-prose p { color: #cabfb2; }
        .lesson-prose h4 { font-family: 'EB Garamond', serif; font-weight: 700; font-size: 1.4rem; margin-top: 28px; margin-bottom: 10px; color: #3a302a; }
        html.dark .lesson-prose h4 { color: #f0e9e0; }
        .lesson-prose ul { margin: 0 0 16px 20px; display: grid; gap: 8px; }
        .lesson-prose li { line-height: 1.6; color: #4a4038; }
        html.dark .lesson-prose li { color: #cabfb2; }
        .lesson-prose strong { color: #3a302a; }
        html.dark .lesson-prose strong { color: #f0e9e0; }
        .skeleton { background: linear-gradient(90deg, #ece6dc 25%, #f6f0e8 37%, #ece6dc 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: .5rem; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        input:focus { outline: none; border-color: #c2652a !important; box-shadow: 0 0 0 3px #fbe8d8; }

        /* ─── Dark mode : surfaces génériques ─── */
        html.dark .bg-background { background-color: #1c1712 !important; }
        html.dark .bg-surface-container-lowest { background-color: #26201a !important; }
        html.dark .bg-surface-container-low { background-color: #241e18 !important; }
        html.dark .bg-surface-container { background-color: #2c2620 !important; }
        html.dark .bg-surface-container-high { background-color: #33291e !important; }
        html.dark .bg-surface { background-color: #1c1712 !important; }
        html.dark .border-outline-variant\/60 { border-color: #4a3f34 !important; }
        html.dark .border-outline-variant\/50 { border-color: #4a3f34 !important; }
        html.dark .border-outline-variant\/40 { border-color: #3a3128 !important; }
        html.dark .border-outline-variant { border-color: #4a3f34 !important; }
        html.dark .text-on-background { color: #f0e9e0 !important; }
        html.dark .text-on-surface-variant { color: #b3a898 !important; }
        html.dark .bg-primary-container\/30 { background-color: rgba(194,101,42,0.18) !important; }

        /* ─── Animations d'apparition ─── */
        [data-animate] { opacity: 0; }
        [data-animate].in-view { animation: fadeSlideUp .7s cubic-bezier(.22,1,.36,1) forwards; }
        @keyframes fadeSlideUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: translateY(0); } }
        .float-slow { animation: floatSlow 6s ease-in-out infinite; }
        @keyframes floatSlow { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .hover-lift { transition: transform .2s ease, box-shadow .2s ease; }
        .hover-lift:hover { transform: translateY(-3px); }
        @media (prefers-reduced-motion: reduce) {
          [data-animate] { opacity: 1 !important; animation: none !important; }
          .float-slow { animation: none !important; }
        }

        /* ─── Panneaux (paramètres / notifications) ─── */
        .panel-backdrop { background: rgba(28,23,18,0.4); backdrop-filter: blur(2px); }
        .panel-sheet { animation: sheetIn .25s cubic-bezier(.22,1,.36,1); }
        @keyframes sheetIn { from { opacity:0; transform: translateY(12px) scale(.98); } to { opacity:1; transform: translateY(0) scale(1); } }
        .toggle-track { width: 44px; height: 26px; border-radius: 999px; background: #d8d0c8; position: relative; transition: background .2s ease; cursor: pointer; flex-shrink: 0; }
        .toggle-track.on { background: #c2652a; }
        .toggle-thumb { width: 20px; height: 20px; border-radius: 999px; background: #fff; position: absolute; top: 3px; left: 3px; transition: transform .2s ease; }
        .toggle-track.on .toggle-thumb { transform: translateX(18px); }
        .lang-btn { padding: 6px 14px; border-radius: 999px; font-size: .82rem; font-weight: 700; border: 1px solid #d8d0c8; }
        .lang-btn.active { background: #c2652a; color: #fff; border-color: #c2652a; }
</style>
</head>
<body class="font-body">

<header class="w-full px-6 md:px-12 py-5 flex items-center justify-between border-b border-outline-variant/60 bg-background">
<a href="/index.html" class="font-headline text-2xl font-bold text-primary">NetInit</a>
<a href="/index.html" class="text-on-surface-variant hover:text-primary"><span class="material-symbols-outlined">close</span></a>
</header>

<main class="max-w-md mx-auto px-6 py-16" data-animate>
  <div class="text-center mb-8">
    <h1 class="font-headline text-4xl font-bold mb-3">Créer un compte</h1>
    <p class="text-on-surface-variant font-body">Rejoignez NetInit et commencez votre apprentissage dès aujourd'hui.</p>
  </div>

  <div class="bg-surface-container-lowest soft-shadow border border-outline-variant/50 rounded-xl p-8">

    <div class="bg-surface-container-low border border-outline-variant/40 rounded-xl p-5 mb-6">
      <div class="flex items-center justify-between mb-3">
        <label class="text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant">Choisissez votre avatar</label>
        <button type="button" id="avatar-reroll" class="text-primary text-sm font-bold font-body flex items-center gap-1">
          <span class="material-symbols-outlined text-base">shuffle</span> Mélanger
        </button>
      </div>
      <div class="grid grid-cols-6 gap-2" id="avatar-grid"></div>
    </div>

    <form id="register-form" novalidate>
      <div class="mb-5">
        <label class="block text-sm font-bold font-body mb-2" for="nom">Nom complet</label>
        <input class="w-full border border-outline-variant rounded-lg px-4 py-3 font-body bg-background" id="nom" type="text" placeholder="Ex: Jean Dupont" required/>
      </div>
      <div class="mb-5">
        <label class="block text-sm font-bold font-body mb-2" for="email">Email</label>
        <input class="w-full border border-outline-variant rounded-lg px-4 py-3 font-body bg-background" id="email" type="email" placeholder="jean.dupont@exemple.com" required/>
      </div>
      <div class="mb-2">
        <label class="block text-sm font-bold font-body mb-2" for="mot_de_passe">Mot de passe</label>
        <input class="w-full border border-outline-variant rounded-lg px-4 py-3 font-body bg-background" id="mot_de_passe" type="password" placeholder="Au moins 6 caractères" required minlength="6"/>
      </div>
      <div class="text-sm text-error font-body mt-3 hidden" id="form-error"></div>
      <button class="w-full bg-primary text-on-primary font-bold py-3.5 rounded-lg mt-6 hover:bg-primary/90 transition-all hover:shadow-lg font-body" id="submit-btn" type="submit">S'inscrire</button>
    </form>
    <p class="text-center text-sm text-on-surface-variant font-body mt-6">Vous avez déjà un compte ? <a class="text-primary font-bold" href="/login.html">Se connecter</a></p>
  </div>
</main>

<footer class="border-t border-outline-variant/60 py-8 mt-16">
<div class="max-w-6xl mx-auto px-6 text-center">
<p class="text-xs text-on-surface-variant/70 font-body">© 2026 NetInit — netinit.vercel.app</p>
</div>
</footer>


<script src="/js/common.js"></script>
<script>
  mountPublicNav();
  let selectedSeed = null;
  function randomSeed() { return Math.random().toString(36).slice(2, 10); }

  function renderAvatarGrid() {
    const seeds = Array.from({ length: 6 }, randomSeed);
    selectedSeed = seeds[0];
    const grid = document.getElementById("avatar-grid");
    grid.innerHTML = seeds.map((s, i) => `
      <button type="button" class="avatar-option ${i === 0 ? "selected" : ""}" data-seed="${s}">
        <img src="${avatarUrl(s, 64)}" alt="Avatar" />
      </button>
    `).join("");
    grid.querySelectorAll(".avatar-option").forEach((btn) => {
      btn.addEventListener("click", () => {
        grid.querySelectorAll(".avatar-option").forEach((b) => b.classList.remove("selected"));
        btn.classList.add("selected");
        selectedSeed = btn.dataset.seed;
      });
    });
  }
  renderAvatarGrid();
  document.getElementById("avatar-reroll").addEventListener("click", renderAvatarGrid);

  const form = document.getElementById("register-form");
  const errorBox = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.add("hidden");
    submitBtn.disabled = true;
    submitBtn.textContent = "Création en cours...";

    const nom = document.getElementById("nom").value.trim();
    const email = document.getElementById("email").value.trim();
    const mot_de_passe = document.getElementById("mot_de_passe").value;

    try {
      await api("/api/register", { method: "POST", body: { nom, email, mot_de_passe, avatarSeed: selectedSeed } });
      window.location.href = "/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.remove("hidden");
      submitBtn.disabled = false;
      submitBtn.textContent = "S'inscrire";
    }
  });
</script>

</body></html>
