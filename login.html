<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Connexion — NetInit</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="nav"><div id="nav-root"></div></header>

<main class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Bon retour</span>
    <h1>Se connecter</h1>
    <p class="sub">Retrouvez vos leçons et votre progression.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="mot_de_passe">Mot de passe</label>
        <input type="password" id="mot_de_passe" name="mot_de_passe" autocomplete="current-password" required />
      </div>

      <div class="form-error" id="form-error"></div>

      <button type="submit" class="btn btn-accent btn-block" id="submit-btn">Se connecter</button>
    </form>

    <p class="auth-switch">Pas encore de compte ? <a href="/register.html">Créer un compte</a></p>
  </div>
</main>

<script src="/js/common.js"></script>
<script>
  mountNav(null);

  const form = document.getElementById("login-form");
  const errorBox = document.getElementById("form-error");
  const submitBtn = document.getElementById("submit-btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("show");
    submitBtn.disabled = true;
    submitBtn.textContent = "Connexion...";

    const email = document.getElementById("email").value.trim();
    const mot_de_passe = document.getElementById("mot_de_passe").value;

    try {
      await api("/api/login", { method: "POST", body: { email, mot_de_passe } });
      window.location.href = "/dashboard.html";
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.classList.add("show");
      submitBtn.disabled = false;
      submitBtn.textContent = "Se connecter";
    }
  });
</script>
</body>
</html>
