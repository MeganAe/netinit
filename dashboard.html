<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tableau de bord — NetInit</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="nav"><div id="nav-root"></div></header>

<main>
  <section class="section" style="padding-top:40px;">
    <div class="container">

      <div class="dash-hero" id="dash-hero">
        <div>
          <h1 id="dash-title">Bienvenue</h1>
          <p id="dash-sub">Chargement de votre progression...</p>
        </div>
        <div class="dash-stat">
          <div class="big" id="dash-count">0/4</div>
          <div class="label">leçons terminées</div>
          <div class="signal-progress" id="dash-bars" style="margin-top:10px; justify-content:flex-end;"></div>
        </div>
      </div>

      <div class="section-head" style="margin-top:44px;">
        <h2>Vos leçons</h2>
        <p>Suivez-les dans l'ordre pour progresser pas à pas, ou choisissez directement celle qui vous intéresse.</p>
      </div>

      <div class="lesson-grid" id="lesson-grid">
        <div class="skeleton" style="height:150px;"></div>
        <div class="skeleton" style="height:150px;"></div>
        <div class="skeleton" style="height:150px;"></div>
        <div class="skeleton" style="height:150px;"></div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>NetInit — Projet tutoré, Université Catholique de Bukavu, 2025 — 2026.</p>
  </div>
</footer>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    await mountNav("/dashboard.html");

    document.getElementById("dash-title").textContent = `Bonjour, ${user.nom.split(" ")[0]}`;

    const lessons = await api("/api/lessons");
    const done = lessons.filter((l) => l.terminee).length;

    document.getElementById("dash-count").textContent = `${done}/${lessons.length}`;
    document.getElementById("dash-bars").innerHTML = signalBarsMarkup(done, lessons.length);
    document.getElementById("dash-sub").textContent =
      done === 0 ? "Vous n'avez pas encore commencé — la première leçon vous attend."
      : done === lessons.length ? "Toutes les leçons sont terminées, bravo !"
      : `Encore ${lessons.length - done} leçon(s) pour tout terminer.`;

    document.getElementById("lesson-grid").innerHTML = lessons.map((l) => `
      <a href="/lesson.html?id=${l.id}" class="lesson-card">
        <div class="top-row">
          <span class="lesson-num">Leçon ${l.ordre} / ${lessons.length}</span>
          <span class="status-pill ${l.terminee ? "done" : "todo"}">${l.terminee ? `Terminé · ${l.score}/${l.total}` : "À faire"}</span>
        </div>
        <h3>${l.titre}</h3>
        <p>${l.resume}</p>
      </a>
    `).join("");
  })();
</script>
</body>
</html>
