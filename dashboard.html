<style>
        body { background-color: #faf5ee; color: #3a302a; }
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal;
            font-size: 24px; line-height: 1; letter-spacing: normal; text-transform: none;
            display: inline-block; white-space: nowrap; word-wrap: normal; direction: ltr;
        }
        .browser-mockup { box-shadow: 0 10px 40px rgba(58,48,42,0.10); border: 1px solid #d8d0c8; }
        .soft-shadow { box-shadow: 0 2px 16px rgba(58,48,42,0.06); }
        /* Barres de signal = progression (4 leçons) */
        .signal-bars { display: flex; align-items: flex-end; gap: 3px; height: 20px; }
        .signal-bars i { display: block; width: 5px; border-radius: 2px; background: #d8d0c8; }
        .signal-bars i.on { background: #c2652a; }
        .signal-bars i:nth-child(1) { height: 7px; } .signal-bars i:nth-child(2) { height: 11px; }
        .signal-bars i:nth-child(3) { height: 15px; } .signal-bars i:nth-child(4) { height: 20px; }
        /* Avatars */
        .avatar-option { border-radius: 9999px; border: 2px solid #d8d0c8; padding: 3px; cursor: pointer; background: #fff; transition: border-color .15s, transform .15s; }
        .avatar-option:hover { transform: translateY(-2px); }
        .avatar-option.selected { border-color: #c2652a; box-shadow: 0 0 0 3px #fbe8d8; }
        .avatar-option img { width: 100%; height: 100%; border-radius: 9999px; display: block; }
        /* Quiz options */
        .quiz-option { border: 1px solid #d8d0c8; border-radius: .75rem; padding: 14px 18px; cursor: pointer; transition: border-color .15s, background .15s; display: flex; align-items: center; gap: 12px; font-family: 'Manrope', sans-serif; }
        .quiz-option:hover { border-color: #c2652a; }
        .quiz-option.selected { border-color: #c2652a; background: #fbe8d8; }
        /* Callout astuce */
        .callout { background: #fbe8d8; border-left: 3px solid #c2652a; border-radius: .5rem; padding: 16px 20px; display: flex; gap: 12px; }
        /* Prose leçon */
        .lesson-prose p { margin-bottom: 16px; line-height: 1.75; color: #4a4038; }
        .lesson-prose h4 { font-family: 'EB Garamond', serif; font-weight: 700; font-size: 1.4rem; margin-top: 28px; margin-bottom: 10px; color: #3a302a; }
        .lesson-prose ul { margin: 0 0 16px 20px; display: grid; gap: 8px; }
        .lesson-prose li { line-height: 1.6; color: #4a4038; }
        .lesson-prose strong { color: #3a302a; }
        .skeleton { background: linear-gradient(90deg, #ece6dc 25%, #f6f0e8 37%, #ece6dc 63%); background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: .5rem; }
        @keyframes shimmer { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }
        input:focus { outline: none; border-color: #c2652a !important; box-shadow: 0 0 0 3px #fbe8d8; }
</style>

      <p class="text-on-surface-variant text-lg font-body" id="dash-sub">Votre parcours d'initiation numérique.</p>
    </div>
    <div class="bg-surface-container-low p-4 rounded-xl border border-outline-variant/40 soft-shadow flex flex-col gap-2 min-w-[220px]">

        <span class="text-xs font-bold uppercase tracking-wider font-label text-on-surface-variant">Progression globale</span>

      </div>
      <div class="signal-bars" id="dash-bars"></div>
      <span class="text-xs text-on-surface-variant font-body" id="dash-count">0 / 4 leçons</span>
    </div>
  </div>

  <div class="grid sm:grid-cols-2 gap-5" id="lesson-grid">
    <div class="skeleton h-40"></div><div class="skeleton h-40"></div>
    <div class="skeleton h-40"></div><div class="skeleton h-40"></div>
  </div>

</div>

<script src="/js/common.js"></script>
<script>
  (async () => {
    const user = await requireUser();
    if (!user) return;
    mountAuthedChrome(user);

    document.getElementById("dash-title").textContent = `Bonjour, ${user.nom.split(" ")[0]}`;

    const lessons = await api("/api/lessons");
    const done = lessons.filter((l) => l.terminee).length;
    const pct = Math.round((done / lessons.length) * 100);

    document.getElementById("dash-pct").textContent = pct + "%";
    document.getElementById("dash-bars").innerHTML = signalBarsHtml(done, lessons.length);
    document.getElementById("dash-count").textContent = `${done} / ${lessons.length} leçons`;
    document.getElementById("dash-sub").textContent =
      done === 0 ? "Votre parcours d'initiation numérique commence ici."
      : done === lessons.length ? "Parcours complet, félicitations !"
      : "Votre parcours d'initiation numérique.";

    const iconMap = { compass: "explore", search: "search", mail: "mail", shield: "shield_lock" };
    const statusBadge = (l) => l.terminee
      ? `<span class="text-xs font-bold font-label bg-success-container text-success px-3 py-1 rounded-full flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-success"></span> Terminée</span>`
      : `<span class="text-xs font-bold font-label bg-surface-container-high text-on-surface-variant px-3 py-1 rounded-full">À faire</span>`;

    document.getElementById("lesson-grid").innerHTML = lessons.map((l) => `
      <a href="/lesson.html?id=${l.id}" class="bg-surface-container-lowest border border-outline-variant/50 rounded-xl p-6 soft-shadow hover:border-primary/40 transition-colors flex flex-col">
        <div class="flex items-start justify-between mb-4">
          <div class="w-11 h-11 rounded-lg ${l.terminee ? "bg-primary text-on-primary" : "bg-primary-container text-on-primary-container"} flex items-center justify-center">
            <span class="material-symbols-outlined text-xl">${iconMap[l.icone] || "menu_book"}</span>
          </div>
          ${statusBadge(l)}
        </div>
        <h3 class="font-headline text-xl font-bold mb-1">${l.titre}</h3>
        <p class="text-sm text-on-surface-variant font-body flex-1">${l.resume}</p>
        ${l.terminee ? `<p class="text-xs font-bold text-primary font-label mt-3">Score : ${l.score}/${l.total}</p>` : ""}
      </a>
    `).join("");
  })();
</script>
